name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python extension/build.py --check
      - name: Check JavaScript
        run: |
          for file in extension/src/*.js; do
            node --check "$file"
          done
      - name: Test extensions
        run: python -m unittest tests.test_extension_files tests.test_native_host tests.test_browser_server

  extensions:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python extension/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: dist/extensions/*.zip
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libfuse2 curl
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
      - name: Build application
        run: |
          pyinstaller --noconfirm --clean Daryafter.spec
      - name: Build DEB
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mkdir -p pkg/opt/daryafter pkg/usr/bin pkg/usr/share/applications pkg/usr/share/icons/hicolor/scalable/apps
          cp -a dist/Daryafter/. pkg/opt/daryafter/
          printf '%s\n' '#!/bin/sh' 'exec /opt/daryafter/Daryafter "$@"' > pkg/usr/bin/daryafter
          chmod 755 pkg/usr/bin/daryafter
          cp packaging/daryafter.desktop pkg/usr/share/applications/
          cp packaging/daryafter.svg pkg/usr/share/icons/hicolor/scalable/apps/
          mkdir -p release-assets
          cat > pkg/DEBIAN-control <<EOF
          Package: daryafter
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Reza Marozi
          Depends: libc6, libstdc++6, libgcc-s1, zlib1g
          Description: Free, open-source multi-connection download manager
          EOF
          mkdir -p pkg/DEBIAN
          mv pkg/DEBIAN-control pkg/DEBIAN/control
          dpkg-deb --build --root-owner-group pkg "release-assets/daryafter_${VERSION}_amd64.deb"
      - name: Build RPM
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb \
            --define "_topdir $PWD/rpmbuild" \
            --define "appdir $PWD/dist/Daryafter" \
            --define "desktop $PWD/packaging/daryafter.desktop" \
            --define "icon $PWD/packaging/daryafter.svg" \
            packaging/rpm/daryafter.spec
          cp rpmbuild/RPMS/x86_64/*.rpm release-assets/
      - name: Build AppImage
        run: |
          mkdir -p AppDir/opt/daryafter AppDir/usr/bin release-assets
          cp -a dist/Daryafter/. AppDir/opt/daryafter/
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/opt/daryafter/Daryafter" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          cp packaging/daryafter.desktop AppDir/daryafter.desktop
          cp packaging/daryafter.svg AppDir/daryafter.svg
          sed -i 's/^Exec=.*/Exec=AppRun/; s/^Icon=.*/Icon=daryafter/' AppDir/daryafter.desktop
          curl -L --fail -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "release-assets/Daryafter-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-assets/*
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
          pyinstaller --noconfirm --clean --onefile --windowed --name Daryafter `
            --collect-all PySide6 --collect-all truststore `
            --hidden-import httpx --hidden-import httpcore `
            --hidden-import h2 --hidden-import socksio appimage_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/Daryafter.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extensions, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
