[project]
name = "daryafter"
version = "0.1.0"
description = "Free, open-source multi-connection download manager for Windows"
readme = "README.md"
authors = [{ name = "Reza Marozi", email = "marozireza2010@gmail.com" }]
keywords = ["download-manager", "downloader", "pyside6", "windows", "resume"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["httpx[http2,socks]>=0.27", "truststore>=0.9", "PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/RezaMarozi/daryafter"
Issues = "https://github.com/RezaMarozi/daryafter/issues"

[project.scripts]
daryafter = "daryafter.app:main"
daryafter-cli = "daryafter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["daryafter*"]
