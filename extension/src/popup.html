<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daryafter</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { width: 320px; }
    .popup-header { padding: 14px 16px 0; margin-bottom: 12px; }
    .popup-header img { width: 32px; height: 32px; }
    .popup-header h1 { font-size: 16px; }
    .popup-header .subtitle { font-size: 12px; }
    .popup-main { padding: 0 16px 14px; display: grid; gap: 10px; }
    .popup-card { padding: 14px; }
    .popup-card .switch-row { align-items: flex-start; }
    .popup-card .hint { margin-top: 2px; }
    .popup-main .status { margin-top: 0; }
    #start-btn { width: 100%; }
    .bridge-line {
      margin: 2px 0 0; color: var(--muted); font-size: 12px;
      display: flex; gap: 6px; align-items: center;
    }
    .popup-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .popup-footer .hint { margin: 0; }
  </style>
</head>
<body>
  <header class="app-header popup-header">
    <img src="icons/icon32.png" alt="">
    <div>
      <h1>Daryafter</h1>
      <p class="subtitle">Download manager</p>
    </div>
    <span class="version" id="version"></span>
  </header>

  <main class="popup-main">
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span class="status-text" id="status-text">Checking&hellip;</span>
    </div>

    <button id="start-btn" class="primary" type="button" hidden>Start Daryafter</button>

    <div class="card popup-card">
      <div class="switch-row">
        <input type="checkbox" id="auto">
        <label class="switch-track" for="auto" aria-hidden="true"></label>
        <div>
          <label class="switch-label" for="auto">Auto-download clicked links</label>
          <p class="hint">Send download links to Daryafter instead of the browser.</p>
        </div>
      </div>
    </div>

    <p class="bridge-line">Bridge <code id="bridge">127.0.0.1:27240</code></p>
  </main>

  <footer class="popup-footer">
    <button class="link" id="options-link" type="button">Options</button>
    <span class="hint" id="save-note" role="status" aria-live="polite"></span>
  </footer>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
